<svg xmlns="http://www.w3.org/2000/svg" width="560" height="32" viewBox="0 0 560 32" role="img" aria-labelledby="title"><title id="title">Stay curious. Follow the clues.</title><style>text{font:12px Consolas,'Liberation Mono',monospace;fill:#c4b29b}.line{animation:line 21s steps(1) infinite;opacity:0}.line-0{opacity:1}.line-1,.reveal-1{animation-delay:7s}.line-2,.reveal-2{animation-delay:14s}.reveal{animation:typing 21s steps(40) infinite;transform-box:fill-box;transform-origin:left}.reveal-1{animation-delay:7s}.reveal-2{animation-delay:14s}@keyframes line{0%,33.3%{opacity:1}33.4%,100%{opacity:0}}@keyframes typing{0%{transform:scaleX(0)}16%,29%{transform:scaleX(1)}33.4%,100%{transform:scaleX(0)}}@media(prefers-reduced-motion:reduce){.line,.reveal{animation:none}.line{opacity:0}.line-0{opacity:1}}</style><g class="line line-0"><clipPath id="r0"><rect class="reveal reveal-0" x="169.2" y="0" width="248" height="32"/></clipPath><text x="169.2" y="21" clip-path="url(#r0)">Stay curious. Follow the clues.</text></g><g class="line line-1"><clipPath id="r1"><rect class="reveal reveal-1" x="151.3" y="0" width="288" height="32"/></clipPath><text x="151.3" y="21" clip-path="url(#r1)">Less noise. More little discoveries.</text></g><g class="line line-2"><clipPath id="r2"><rect class="reveal reveal-2" x="137.0" y="0" width="320" height="32"/></clipPath><text x="137.0" y="21" clip-path="url(#r2)">Made for your agent, and your curiosity.</text></g></svg>