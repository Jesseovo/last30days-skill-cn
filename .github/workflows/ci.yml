name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }} / ${{ matrix.extras }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
        extras: [none, jieba]
        include:
          # Old macOS (Catalina) ships Python 3.8 as /usr/bin/python3 (issue #13).
          - os: ubuntu-22.04
            python-version: "3.8"
            extras: none
          - os: macos-latest
            python-version: "3.12"
            extras: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Install optional jieba
        if: matrix.extras == 'jieba'
        run: python -m pip install jieba

      - name: Byte-compile sources
        run: python -m compileall -q scripts skills/last30days/scripts

      - name: Run tests
        run: python -m pytest tests -q

      - name: Check payload drift
        run: python scripts/build_payload.py --check

      - name: CLI smoke test
        run: |
          python scripts/last30days.py --version
          python scripts/last30days.py --help
          python skills/last30days/scripts/last30days.py --version
